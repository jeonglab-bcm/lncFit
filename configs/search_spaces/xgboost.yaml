# Search space for lncfit.classifiers.xgboost_clf.XGBoostClassifier.
# `grid`     -> used by tuning.method: grid   (itertools.product over every listed value)
# `type`/`low`/`high`/`log` -> used by tuning.method: optuna (trial.suggest_float/int)
# A param needs only the block(s) its intended tuning method actually uses.

learning_rate:
  type: float
  low: 0.005
  high: 0.2
  log: true
  grid: [0.01, 0.02, 0.05, 0.1]

max_depth:
  type: int
  low: 3
  high: 9
  grid: [4, 6, 9]

subsample:
  type: float
  low: 0.5
  high: 1.0
  grid: [0.5, 0.7, 0.9]

colsample_bytree:
  type: float
  low: 0.5
  high: 1.0
  grid: [0.5, 0.7, 0.9]

min_child_weight:
  type: int
  low: 1
  high: 10
  grid: [1, 3, 5]

reg_alpha:
  type: float
  low: 1.0e-8
  high: 10.0
  log: true
  grid: [1.0e-4, 1.0e-2, 1.0, 3.0]

reg_lambda:
  type: float
  low: 1.0e-8
  high: 10.0
  log: true
  grid: [1.0e-6, 1.0e-4, 1.0e-2, 1.0]
