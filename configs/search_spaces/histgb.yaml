# Search space for lncfit.classifiers.histgb.HistGradientBoostingClassifier.
# `grid`     -> used by tuning.method: grid
# `type`/`low`/`high`/`log` -> used by tuning.method: optuna
#
# class_weight is deliberately NOT searched -- this wrapper exists to test
# balanced weighting, so leave it at its "balanced" default rather than letting
# a search turn it off.

learning_rate:
  type: float
  low: 0.005
  high: 0.3
  log: true
  grid: [0.01, 0.05, 0.1]

max_leaf_nodes:
  type: int
  low: 15
  high: 255
  grid: [15, 31, 63]

min_samples_leaf:
  type: int
  low: 5
  high: 100
  grid: [10, 20, 50]

l2_regularization:
  type: float
  low: 1.0e-8
  high: 10.0
  log: true
  grid: [0.0, 0.1, 1.0]
