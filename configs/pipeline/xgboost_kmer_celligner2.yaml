# Same fixed hyperparameters as xgboost_kmer_fixed.yaml, plus the 2-D Celligner
# UMAP cell-line embedding (dim=2 -- the best-performing setting in the
# project's own sweep, see data/external/README.md).
#
# Run: uv run python scripts/run_pipeline.py --config configs/pipeline/xgboost_kmer_celligner2.yaml

data:
  train: data/processed/train_lncrna_day14_chrom1.jsonl.gz
  test: data/processed/test_lncrna_day14_chrom1.jsonl.gz
  transcript_sequences: data/processed/body_sequences_transcript.json

features:
  type: kmer
  k: 5
  include_distance: false
  cell_embedding_dim: 2     # 2-D Celligner UMAP

model:
  name: xgboost
  params:
    learning_rate: 0.02
    max_depth: 9
    subsample: 0.5
    colsample_bytree: 0.9
    min_child_weight: 3
    reg_alpha: 3.188749808609341
    reg_lambda: 3.078336708769974e-06
    scale_pos_weight: 1.0

tuning:
  method: fixed

cv:
  strategy: stratified
  n_splits: 5

seed: 42
output_dir: results/lncrna_rra_day14/pipeline_runs
