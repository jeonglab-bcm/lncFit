# Leave-one-cell-line-out baseline, k-mer features, XGBoost -- same fixed
# hyperparameters as configs/pipeline/xgboost_kmer_fixed.yaml, for a direct
# comparison between the chromosome-held-out and cell-line-held-out protocols.
#
# Run: uv run python scripts/run_cellline_loco.py --config configs/cellline_loco/xgboost_kmer.yaml

data:
  path: data/processed/lncrna_rra_day14.jsonl.gz
  transcript_sequences: data/processed/body_sequences_transcript.json

features:
  type: kmer
  k: 5
  include_distance: false
  cell_embedding_dim: 0

model:
  name: xgboost
  params:
    learning_rate: 0.02
    max_depth: 9
    subsample: 0.5
    colsample_bytree: 0.9
    min_child_weight: 3
    reg_alpha: 3.188749808609341
    reg_lambda: 3.078336708769974e-06
    scale_pos_weight: 1.0

seed: 42
output_dir: results/lncrna_rra_day14_cellline_loco/runs
