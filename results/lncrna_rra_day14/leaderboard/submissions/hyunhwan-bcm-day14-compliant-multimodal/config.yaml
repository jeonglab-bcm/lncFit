data:
  train: data/processed/train_lncrna_day14_chrom1.jsonl.gz
  test: data/processed/test_lncrna_day14_chrom1.jsonl.gz
  target_day: 14
  day7_features_used: false
  supplementary_workbook: data/raw/mmc2.xlsx
  transcript_sequences: data/processed/body_sequences_transcript.json

features:
  shared:
    - static S1A annotations
    - baseline and pre-screen expression from S1C and S1E
    - handcrafted transcript length, GC, entropy, and dinucleotide frequencies
    - Celligner PCA(70)
    - cell-line indicators
  explicitly_excluded:
    - Day-7 measurements
    - Number of cell lines showing essentiality
    - guide-sequence and guide-design features
  frozen_embeddings:
    dnabert2_5prime: data/processed/dnabert2_transcript_full.npz
    dnabert2_3prime: data/processed/dnabert2_transcript_last.npz
    nucleotide_transformer_5prime: data/processed/nucleotide_transformer_transcript_full.npz
  embedding_models:
    dnabert2:
      repository: zhihan1996/DNABERT-2-117M
      revision: 7bce263b15377fc15361f52cfab88f8b586abda0
      windows: [first, last]
    nucleotide_transformer:
      repository: InstaDeepAI/nucleotide-transformer-v2-50m-multi-species
      revision: 81b29e5786726d891dbf929404ef20adca5b36f1
      loader: AutoModelForMaskedLM
      window: first

models:
  binary_target: "Day-14 RRA p-value < 0.05"
  strength_target: "min(-log10(Day-14 RRA p-value), 8)"
  estimator: XGBoost
  common_params:
    n_estimators: 600
    learning_rate: 0.03
    max_depth: 5
    min_child_weight: 3
    subsample: 0.75
    colsample_bytree: 0.75
    reg_alpha: 1.0
    reg_lambda: 1.0
    tree_method: hist
    seed: 42
  depth3_strength_ablation:
    max_depth: 3

ensemble:
  method: weighted rank average
  selection: fixed from chromosome-grouped OOF predictions only
  scored_cell_lines: [HAP1, K562, MDA-MB-231, THP1]
  weights:
    static_binary_depth5: 0.0798
    static_strength_depth5: 0.0798
    static_strength_depth3: 0.0500
    dnabert2_5prime_binary: 0.1064
    dnabert2_5prime_strength: 0.2660
    dnabert2_3prime_binary: 0.1140
    dnabert2_3prime_strength: 0.1140
    nucleotide_transformer_5prime_binary: 0.0950
    nucleotide_transformer_5prime_strength: 0.0950

cv:
  strategy: StratifiedGroupKFold
  groups: chromosome
  folds: 5
  shuffle: true
  seed: 42
  scored_oof_auroc: 0.7233
  scored_oof_auprc: 0.1935

implementation:
  training_script: scripts/run_day14_compliant_multimodal.py
  embedding_script: scripts/embed_sequences.py
