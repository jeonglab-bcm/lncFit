submitter: hyunhwan-bcm
model: Day-14-only pre-screen Cas13 guide-design XGBoost rank ensemble
description: >
  Leakage-audited de novo Day-14 prediction with no Day-0 or Day-7 measurements
  and no screen measurements used as features. The selected ensemble adds only
  pre-screen Cas13 library-design features from S1B: guide count, sequence
  composition, positional bases, complexity, self-complementarity, longest-
  isoform target coverage and position, and local transcript context. Day-14 RRA
  labels and p-values are used only as supervised training outcomes. The
  target-derived S1A column "Number of cell lines showing essentiality" remains
  explicitly excluded.

  Feature blocks, model depths, and coarse rank weights were frozen using five-fold
  chromosome-grouped out-of-fold predictions (seed 42), with all rows for a
  chromosome held together. Expression-specificity, transcript-architecture,
  target-flank, alternative-tree, SVM, continuous-depletion, and added language-
  model blocks were evaluated and rejected when they failed to improve OOF
  performance. On the four scored cell lines, the frozen ensemble reached AUROC
  0.8181 and AUPRC 0.2632. Chromosome 1 was reserved for one final leaderboard
  evaluation after selection, where the repository scorer measured AUROC 0.8330
  and AUPRC 0.3088.
