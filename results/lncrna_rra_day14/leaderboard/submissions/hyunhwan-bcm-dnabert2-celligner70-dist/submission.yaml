submitter: hyunhwan-bcm
model: xgboost + DNABERT-2 + Celligner PCA (dim=70) + distance-to-gene, fixed params (max_depth=9)
description: >
  No hyperparameter search -- fixed params matching the project's established
  best-known xgboost config (configs/pipeline/xgboost_kmer_fixed.yaml,
  max_depth=9 etc). Manually tried 8 fixed-param variants (cell_embedding_dim
  in {0,2,70}, include_distance, scale_pos_weight reweighting) and kept this
  one: DNABERT-2 embeddings + full 70-D Celligner PCA + distance-to-nearest-
  protein-coding-gene. Beats the k-mer baseline by a real margin: AUROC
  0.6902->0.7010, AUPRC 0.1472->0.1733 (~18% relative AUPRC improvement).
