submitter: jeonglab-bcm
model: xgboost + kmer (k=5) + Celligner UMAP (dim=2)
# k-mer + Celligner embedding
uses_measured_depletion: false
description: 'Leave-one-cell-line-out via scripts/run_cellline_loco.py, unmodified -- same
  fixed hyperparameters as the no-cell-embedding LOCO baseline, plus the 2-D Celligner UMAP
  cell-line embedding. Celligner coordinates come from independent baseline transcriptomic
  profiling of each cell line (not the RRA screen labels), so supplying the held-out cell
  line''s own coordinate at test time is not label leakage -- it tests whether transcriptomic
  similarity to the 3 training cell lines helps the model generalize to the 4th. HEK293FT
  excluded (not a real cancer line).


  Carried over from the earlier 4-fold leave-one-cell-line-out challenge, keeping only its
  THP1 rows. Those predictions came from a model trained on HAP1/K562/MDA-MB-231 with THP1
  entirely held out, which is exactly this challenge''s protocol -- so the score is valid
  here, and was produced before THP1''s labels were made private.'
