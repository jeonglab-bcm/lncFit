submitter: hyunhwan-bcm
model: Fold-safe Day-14 cross-cell guide-transfer XGBoost ensemble
description: 'True four-fold leave-one-cell-line-out prediction for Day 14. Each fold uses
  the same lncRNA''s gene-level and individual-guide Day-14 depletion measurements from the
  three training cell lines, together with pre-screen annotations, cell-specific expression,
  transcript sequence, and Cas13 guide-design features. Guide summaries include depletion
  order statistics, replicate agreement, and the fraction of consistently depleted guides.
  The held-out cell line''s labels, p-values, fold changes, and guide outcomes are never used
  by that fold. Day-0 and Day-7 measurements are never loaded.

  The final prediction is a fixed min-max-normalized blend of five pseudohuber XGBoost depletion
  regressors (depths 1, 3, and 5). Its strongest component explicitly matches source count:
  a training row sees two other training lines, and each held-out prediction is averaged across
  the three possible two-source views. Fixed weights are 0.36 expression-matched guide-depth3,
  0.11 source-specific gene-depth1, 0.14 expression-only-depth1, 0.18 full guide-depth5, and
  0.21 full guide-depth3. Overall LOCO performance is AUROC 0.7781 and AUPRC 0.2186, up from
  this submission''s previous 0.7332/0.1784.


  Carried over from the retired 4-fold leave-one-cell-line-out challenge, keeping only its
  THP1 rows. That fold trained on HAP1/K562/MDA-MB-231 with THP1''s labels, p-values, fold
  changes and guide outcomes all withheld, which is exactly this challenge''s protocol, so
  the score transfers unchanged.'
